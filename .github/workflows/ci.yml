name: Continuous Integration - JOMO Backend

on:
  push:
    branches: [main, develop, feature/enhance-generation]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ai29/jomo-backend

jobs:
  # Run tests (if you have any)
  # test:
  #   name: Run Tests
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
    
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
      
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #         cache: 'npm'
      
  #     - name: Install dependencies
  #       run: npm ci
      
  #     - name: Run tests
  #       run: npm test
  #       env:
  #         NODE_ENV: test

  # Build and push Docker image
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      should-deploy: ${{ steps.check.outputs.should-deploy }}
      environment: ${{ steps.check.outputs.environment }}
      image-tag: ${{ steps.check.outputs.image-tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Docker/Dockerfile.dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      
      - name: Check deployment conditions
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" && ("${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/feature/enhance-generation") ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "environment=production" >> $GITHUB_OUTPUT
              echo "image-tag=main-${{ github.sha }}" >> $GITHUB_OUTPUT
            elif [[ "${{ github.ref }}" == "refs/heads/feature/enhance-generation" ]]; then
              echo "environment=staging" >> $GITHUB_OUTPUT
              echo "image-tag=feature-enhance-generation-${{ github.sha }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Image scan (optional security check)
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Docker image built successfully"
          echo "Image: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  # Trigger deployment (only for main and feature branches)
  trigger-deployment:
    name: Trigger Deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.should-deploy == 'true'
    
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: deploy-${{ needs.build-and-push.outputs.environment }}
          client-payload: |
            {
              "image_tag": "${{ needs.build-and-push.outputs.image-tag }}",
              "environment": "${{ needs.build-and-push.outputs.environment }}",
              "commit_sha": "${{ github.sha }}",
              "commit_message": "${{ github.event.head_commit.message }}",
              "author": "${{ github.event.head_commit.author.name }}"
            }