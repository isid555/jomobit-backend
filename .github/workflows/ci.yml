name: Continuous Integration - JOMO Backend

on:
  push:
    branches: [main, develop, feature/enhance-generation]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ai29/jomo-backend
  CONTAINER_NAME: jomo-backend

jobs:
  # Build and push Docker image
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      should-deploy: ${{ steps.check-deploy.outputs.should-deploy }}
      environment: ${{ steps.check-deploy.outputs.environment }}
      image-tag: ${{ steps.check-deploy.outputs.image-tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Docker/Dockerfile.dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      
      - name: Check deployment conditions
        id: check-deploy
        run: |
          if [[ "${{ github.event_name }}" == "push" && ("${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/feature/enhance-generation") ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "environment=production" >> $GITHUB_OUTPUT
            else
              echo "environment=staging" >> $GITHUB_OUTPUT
            fi
            echo "image-tag=${{ github.ref_name }}-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.should-deploy == 'true' && needs.build-and-push.outputs.environment == 'production'
    
    environment:
      name: production
      url: https://api.jomo.dazzeldigital.com
    
    steps:
      - name: Deploy via Bastion Host
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ${{ secrets.BASTION_USER }}
          key: ${{ secrets.BASTION_SSH_KEY }}
          port: ${{ secrets.BASTION_PORT || 22 }}
          timeout: 300s
          script: |
            # Create SSH key for backend server access
            echo "${{ secrets.BACKEND_SSH_KEY || secrets.BASTION_SSH_KEY }}" > /tmp/backend_key
            chmod 600 /tmp/backend_key
            
            # SSH into the backend server through bastion
            ssh -i /tmp/backend_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 ${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }} << 'ENDSSH'
            
            set -e  # Exit on any error
            
            # Deployment variables
            export DOCKER_IMAGE="${{ env.DOCKER_IMAGE }}"
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
            export CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            export NEW_CONTAINER_NAME="${CONTAINER_NAME}-new"
            
            echo "=== Starting Zero-Downtime Production Deployment ==="
            echo "Image: ${DOCKER_IMAGE}:${IMAGE_TAG}"
            echo "Container: ${CONTAINER_NAME}"
            
            # Pull the latest image
            echo "📦 Pulling Docker image..."
            docker pull ${DOCKER_IMAGE}:${IMAGE_TAG}
            
            # Start new container with different name (Blue-Green deployment)
            echo "🚀 Starting new container..."
            docker run -d \
              --name ${NEW_CONTAINER_NAME} \
              --restart unless-stopped \
              -p 3001:3000 \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e REDIS_URL="${{ secrets.REDIS_URL }}" \
              -e LOG_LEVEL="${{ secrets.LOG_LEVEL || 'info' }}" \
              -e AUTH0_DOMAIN="${{ secrets.AUTH0_DOMAIN }}" \
              -e AUTH0_AUDIENCE="${{ secrets.AUTH0_AUDIENCE }}" \
              -e AUTH0_CLIENT_ID="${{ secrets.AUTH0_CLIENT_ID }}" \
              -e AUTH0_CLIENT_SECRET="${{ secrets.AUTH0_CLIENT_SECRET }}" \
              -e AUTH0_WEBHOOK_SECRET="${{ secrets.AUTH0_WEBHOOK_SECRET }}" \
              -e AUTH0_ACTIONS_SECRET="${{ secrets.AUTH0_ACTIONS_SECRET }}" \
              -e RAZORPAY_KEY_ID="${{ secrets.RAZORPAY_KEY_ID }}" \
              -e RAZORPAY_KEY_SECRET="${{ secrets.RAZORPAY_KEY_SECRET }}" \
              -e RAZORPAY_WEBHOOK_SECRET="${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" \
              -e DEFAULT_USER_CREDITS="${{ secrets.DEFAULT_USER_CREDITS || '3' }}" \
              -e SUBSCRIPTION_RECONCILIATION_ENABLED="${{ secrets.SUBSCRIPTION_RECONCILIATION_ENABLED || 'true' }}" \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e IDEOGRAM_API_KEY="${{ secrets.IDEOGRAM_API_KEY }}" \
              -e FAL_KEY="${{ secrets.FAL_KEY }}" \
              -e IMAGEKIT_PUBLIC_KEY="${{ secrets.IMAGEKIT_PUBLIC_KEY }}" \
              -e IMAGEKIT_PRIVATE_KEY="${{ secrets.IMAGEKIT_PRIVATE_KEY }}" \
              -e IMAGEKIT_URL_ENDPOINT="${{ secrets.IMAGEKIT_URL_ENDPOINT }}" \
              -e SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
              -e N8N_WEBHOOK_URL="${{ secrets.N8N_WEBHOOK_URL }}" \
              -e N8N_JWT_SECRET="${{ secrets.N8N_JWT_SECRET }}" \
              -e N8N_REQUEST_KEY="${{ secrets.N8N_REQUEST_KEY }}" \
              -e N8N_GENERATION_FLOW_ID="${{ secrets.N8N_GENERATION_FLOW_ID }}" \
              -e N8N_ENHANCEMENT_FLOW_ID="${{ secrets.N8N_ENHANCEMENT_FLOW_ID }}" \
              ${DOCKER_IMAGE}:${IMAGE_TAG}
            
            # Wait for new container to be ready
            echo "⏳ Waiting for new container to start..."
            sleep 15
            
            # Health check on new container
            echo "🏥 Performing health check on new container..."
            HEALTH_CHECK_PASSED=false
            for i in {1..30}; do
              if curl -f -s http://localhost:3001/health > /dev/null 2>&1; then
                echo "✅ Health check passed on attempt $i!"
                HEALTH_CHECK_PASSED=true
                break
              fi
              echo "❌ Health check attempt $i failed, retrying in 5 seconds..."
              sleep 5
            done
            
            if [ "$HEALTH_CHECK_PASSED" = false ]; then
              echo "🚨 Health check failed! Rolling back..."
              docker stop ${NEW_CONTAINER_NAME} || true
              docker rm ${NEW_CONTAINER_NAME} || true
              exit 1
            fi
            
            # Switch traffic (Blue-Green switch)
            echo "🔄 Switching traffic to new container..."
            
            # Stop old container
            if docker ps -q -f name=${CONTAINER_NAME} | grep -q .; then
              echo "🛑 Stopping old container..."
              docker stop ${CONTAINER_NAME} || true
              docker rm ${CONTAINER_NAME} || true
            fi
            
            # Rename new container to production name and switch port
            echo "🔀 Switching to production..."
            docker stop ${NEW_CONTAINER_NAME}
            docker rm ${NEW_CONTAINER_NAME}
            
            # Start final production container
            docker run -d \
              --name ${CONTAINER_NAME} \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e REDIS_URL="${{ secrets.REDIS_URL }}" \
              -e LOG_LEVEL="${{ secrets.LOG_LEVEL || 'info' }}" \
              -e AUTH0_DOMAIN="${{ secrets.AUTH0_DOMAIN }}" \
              -e AUTH0_AUDIENCE="${{ secrets.AUTH0_AUDIENCE }}" \
              -e AUTH0_CLIENT_ID="${{ secrets.AUTH0_CLIENT_ID }}" \
              -e AUTH0_CLIENT_SECRET="${{ secrets.AUTH0_CLIENT_SECRET }}" \
              -e AUTH0_WEBHOOK_SECRET="${{ secrets.AUTH0_WEBHOOK_SECRET }}" \
              -e AUTH0_ACTIONS_SECRET="${{ secrets.AUTH0_ACTIONS_SECRET }}" \
              -e RAZORPAY_KEY_ID="${{ secrets.RAZORPAY_KEY_ID }}" \
              -e RAZORPAY_KEY_SECRET="${{ secrets.RAZORPAY_KEY_SECRET }}" \
              -e RAZORPAY_WEBHOOK_SECRET="${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" \
              -e DEFAULT_USER_CREDITS="${{ secrets.DEFAULT_USER_CREDITS || '3' }}" \
              -e SUBSCRIPTION_RECONCILIATION_ENABLED="${{ secrets.SUBSCRIPTION_RECONCILIATION_ENABLED || 'true' }}" \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e IDEOGRAM_API_KEY="${{ secrets.IDEOGRAM_API_KEY }}" \
              -e FAL_KEY="${{ secrets.FAL_KEY }}" \
              -e IMAGEKIT_PUBLIC_KEY="${{ secrets.IMAGEKIT_PUBLIC_KEY }}" \
              -e IMAGEKIT_PRIVATE_KEY="${{ secrets.IMAGEKIT_PRIVATE_KEY }}" \
              -e IMAGEKIT_URL_ENDPOINT="${{ secrets.IMAGEKIT_URL_ENDPOINT }}" \
              -e SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
              -e N8N_WEBHOOK_URL="${{ secrets.N8N_WEBHOOK_URL }}" \
              -e N8N_JWT_SECRET="${{ secrets.N8N_JWT_SECRET }}" \
              -e N8N_REQUEST_KEY="${{ secrets.N8N_REQUEST_KEY }}" \
              -e N8N_GENERATION_FLOW_ID="${{ secrets.N8N_GENERATION_FLOW_ID }}" \
              -e N8N_ENHANCEMENT_FLOW_ID="${{ secrets.N8N_ENHANCEMENT_FLOW_ID }}" \
              ${DOCKER_IMAGE}:${IMAGE_TAG}
            
            # Final health check
            echo "🏥 Final health check..."
            sleep 10
            for i in {1..15}; do
              if curl -f -s http://localhost:3000/health > /dev/null 2>&1; then
                echo "✅ Production deployment successful!"
                break
              fi
              echo "⏳ Final health check attempt $i..."
              sleep 3
            done
            
            # Clean up old images (keep last 5)
            echo "🧹 Cleaning up old images..."
            docker images ${DOCKER_IMAGE} --format "table {{.Repository}}:{{.Tag}}\t{{.CreatedAt}}" | tail -n +2 | sort -k2 -r | tail -n +6 | awk '{print $1}' | xargs -r docker rmi || true
            
            echo "🎉 Zero-downtime deployment completed successfully!"
            echo "📊 Container status:"
            docker ps -f name=${CONTAINER_NAME}
            
            ENDSSH
            
            # Clean up temporary key
            rm -f /tmp/backend_key

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.should-deploy == 'true' && needs.build-and-push.outputs.environment == 'staging'
    
    environment:
      name: staging
      url: https://staging-api.jomo.dazzeldigital.com
    
    steps:
      - name: Deploy to Staging via Bastion Host
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ${{ secrets.BASTION_USER }}
          key: ${{ secrets.BASTION_SSH_KEY }}
          port: ${{ secrets.BASTION_PORT || 22 }}
          timeout: 300s
          script: |
            # Create SSH key for backend server access
            echo "${{ secrets.BACKEND_SSH_KEY || secrets.BASTION_SSH_KEY }}" > /tmp/backend_key
            chmod 600 /tmp/backend_key
            
            # SSH into the backend server through bastion
            ssh -i /tmp/backend_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 ${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }} << 'ENDSSH'
            
            set -e  # Exit on any error
            
            # Deployment variables for staging
            export DOCKER_IMAGE="${{ env.DOCKER_IMAGE }}"
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
            export CONTAINER_NAME="${{ env.CONTAINER_NAME }}-staging"
            
            echo "=== Starting Staging Deployment ==="
            echo "Image: ${DOCKER_IMAGE}:${IMAGE_TAG}"
            echo "Container: ${CONTAINER_NAME}"
            
            # Pull the latest image
            echo "📦 Pulling Docker image..."
            docker pull ${DOCKER_IMAGE}:${IMAGE_TAG}
            
            # Stop existing staging container if exists
            if docker ps -q -f name=${CONTAINER_NAME} | grep -q .; then
              echo "🛑 Stopping existing staging container..."
              docker stop ${CONTAINER_NAME} || true
              docker rm ${CONTAINER_NAME} || true
            fi
            
            # Start staging container on port 3002
            echo "🚀 Starting staging container..."
            docker run -d \
              --name ${CONTAINER_NAME} \
              --restart unless-stopped \
              -p 3002:3000 \
              -e NODE_ENV=staging \
              -e PORT=3000 \
              -e FRONTEND_URL="${{ secrets.STAGING_FRONTEND_URL || secrets.FRONTEND_URL }}" \
              -e MONGODB_URI="${{ secrets.STAGING_MONGODB_URI || secrets.MONGODB_URI }}" \
              -e REDIS_URL="${{ secrets.STAGING_REDIS_URL || secrets.REDIS_URL }}" \
              -e LOG_LEVEL="${{ secrets.LOG_LEVEL || 'debug' }}" \
              -e AUTH0_DOMAIN="${{ secrets.STAGING_AUTH0_DOMAIN || secrets.AUTH0_DOMAIN }}" \
              -e AUTH0_AUDIENCE="${{ secrets.STAGING_AUTH0_AUDIENCE || secrets.AUTH0_AUDIENCE }}" \
              -e AUTH0_CLIENT_ID="${{ secrets.STAGING_AUTH0_CLIENT_ID || secrets.AUTH0_CLIENT_ID }}" \
              -e AUTH0_CLIENT_SECRET="${{ secrets.STAGING_AUTH0_CLIENT_SECRET || secrets.AUTH0_CLIENT_SECRET }}" \
              -e AUTH0_WEBHOOK_SECRET="${{ secrets.STAGING_AUTH0_WEBHOOK_SECRET || secrets.AUTH0_WEBHOOK_SECRET }}" \
              -e AUTH0_ACTIONS_SECRET="${{ secrets.STAGING_AUTH0_ACTIONS_SECRET || secrets.AUTH0_ACTIONS_SECRET }}" \
              -e RAZORPAY_KEY_ID="${{ secrets.STAGING_RAZORPAY_KEY_ID || secrets.RAZORPAY_KEY_ID }}" \
              -e RAZORPAY_KEY_SECRET="${{ secrets.STAGING_RAZORPAY_KEY_SECRET || secrets.RAZORPAY_KEY_SECRET }}" \
              -e RAZORPAY_WEBHOOK_SECRET="${{ secrets.STAGING_RAZORPAY_WEBHOOK_SECRET || secrets.RAZORPAY_WEBHOOK_SECRET }}" \
              -e DEFAULT_USER_CREDITS="${{ secrets.DEFAULT_USER_CREDITS || '10' }}" \
              -e SUBSCRIPTION_RECONCILIATION_ENABLED="${{ secrets.SUBSCRIPTION_RECONCILIATION_ENABLED || 'false' }}" \
              -e OPENAI_API_KEY="${{ secrets.STAGING_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}" \
              -e GEMINI_API_KEY="${{ secrets.STAGING_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}" \
              -e IDEOGRAM_API_KEY="${{ secrets.STAGING_IDEOGRAM_API_KEY || secrets.IDEOGRAM_API_KEY }}" \
              -e FAL_KEY="${{ secrets.STAGING_FAL_KEY || secrets.FAL_KEY }}" \
              -e IMAGEKIT_PUBLIC_KEY="${{ secrets.STAGING_IMAGEKIT_PUBLIC_KEY || secrets.IMAGEKIT_PUBLIC_KEY }}" \
              -e IMAGEKIT_PRIVATE_KEY="${{ secrets.STAGING_IMAGEKIT_PRIVATE_KEY || secrets.IMAGEKIT_PRIVATE_KEY }}" \
              -e IMAGEKIT_URL_ENDPOINT="${{ secrets.STAGING_IMAGEKIT_URL_ENDPOINT || secrets.IMAGEKIT_URL_ENDPOINT }}" \
              -e SLACK_WEBHOOK_URL="${{ secrets.STAGING_SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}" \
              -e N8N_WEBHOOK_URL="${{ secrets.STAGING_N8N_WEBHOOK_URL || secrets.N8N_WEBHOOK_URL }}" \
              -e N8N_JWT_SECRET="${{ secrets.STAGING_N8N_JWT_SECRET || secrets.N8N_JWT_SECRET }}" \
              -e N8N_REQUEST_KEY="${{ secrets.STAGING_N8N_REQUEST_KEY || secrets.N8N_REQUEST_KEY }}" \
              -e N8N_GENERATION_FLOW_ID="${{ secrets.STAGING_N8N_GENERATION_FLOW_ID || secrets.N8N_GENERATION_FLOW_ID }}" \
              -e N8N_ENHANCEMENT_FLOW_ID="${{ secrets.STAGING_N8N_ENHANCEMENT_FLOW_ID || secrets.N8N_ENHANCEMENT_FLOW_ID }}" \
              ${DOCKER_IMAGE}:${IMAGE_TAG}
            
            # Health check
            echo "🏥 Performing staging health check..."
            sleep 10
            for i in {1..20}; do
              if curl -f -s http://localhost:3002/health > /dev/null 2>&1; then
                echo "✅ Staging deployment successful!"
                break
              fi
              echo "⏳ Health check attempt $i..."
              sleep 3
            done
            
            echo "🎉 Staging deployment completed!"
            echo "📊 Container status:"
            docker ps -f name=${CONTAINER_NAME}
            
            ENDSSH
            
            # Clean up temporary key
            rm -f /tmp/backend_key