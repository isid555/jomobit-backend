name: CI/CD Pipeline - JOMO Backend

on:
  push:
    branches: [main, develop, feature/enhance-generation]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: 'Docker image tag to deploy (e.g., main-abc123)'
        required: false
        type: string
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

env:
  DOCKER_IMAGE: ai29/jomo-backend
  CONTAINER_NAME: jomo-backend

jobs:
  # Run tests (if you have any)
  # test: n
  #   name: Run Tests
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
    
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
      
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #         cache: 'npm'
      
  #     - name: Install dependencies
  #       run: npm ci
      
  #     - name: Run tests
  #       run: npm test
  #       env:
  #         NODE_ENV: test

  # Build and push Docker image
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      should-deploy: ${{ steps.check.outputs.should-deploy }}
      environment: ${{ steps.check.outputs.environment }}
      image-tag: ${{ steps.check.outputs.image-tag }}
      container-name: ${{ steps.check.outputs.container-name }}
      port: ${{ steps.check.outputs.port }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Docker/Dockerfile.dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      
      - name: Check deployment conditions
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" && ("${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/feature/enhance-generation") ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "environment=production" >> $GITHUB_OUTPUT
              echo "image-tag=main-${{ github.sha }}" >> $GITHUB_OUTPUT
              echo "container-name=${{ env.CONTAINER_NAME }}" >> $GITHUB_OUTPUT
              echo "port=3000" >> $GITHUB_OUTPUT
            elif [[ "${{ github.ref }}" == "refs/heads/feature/enhance-generation" ]]; then
              echo "environment=staging" >> $GITHUB_OUTPUT
              echo "image-tag=feature-enhance-generation-${{ github.sha }}" >> $GITHUB_OUTPUT
              echo "container-name=${{ env.CONTAINER_NAME }}-staging" >> $GITHUB_OUTPUT
              echo "port=3002" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
            if [ -z "$IMAGE_TAG" ]; then
              if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
                IMAGE_TAG="develop"
              else
                IMAGE_TAG="latest"
              fi
            fi
            
            echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
            
            if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
              echo "container-name=${{ env.CONTAINER_NAME }}-staging" >> $GITHUB_OUTPUT
              echo "port=3002" >> $GITHUB_OUTPUT
            else
              echo "container-name=${{ env.CONTAINER_NAME }}" >> $GITHUB_OUTPUT
              echo "port=3000" >> $GITHUB_OUTPUT
            fi
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Image scan (optional security check)
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Docker image built successfully"
          echo "Image: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  # Deploy to environment
  deploy:
    name: Deploy to ${{ needs.build-and-push.outputs.environment }}
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      (needs.build-and-push.outputs.should-deploy == 'true' && github.event.inputs.action != 'rollback') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    
    environment:
      name: ${{ needs.build-and-push.outputs.environment }}
      url: ${{ needs.build-and-push.outputs.environment == 'staging' && 'https://staging-api.jomo.dazzeldigital.com' || 'https://api.jomo.dazzeldigital.com' }}
    
    steps:
      - name: Deploy via Bastion Host
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ${{ secrets.BASTION_USER }}
          key: ${{ secrets.BASTION_SSH_KEY }}
          port: ${{ secrets.BASTION_PORT || 22 }}
          timeout: 300s
          script: |
            echo "🔗 Connecting to backend server..."
            echo "Bastion: ${{ secrets.BASTION_HOST }}"
            echo "Backend: ${{ secrets.BACKEND_HOST }}"
            echo "User: ${{ secrets.BACKEND_USER }}"
            
            # Test connection first
            if ! ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }} 'echo "Connection test successful"'; then
              echo "❌ Cannot connect to backend server"
              echo "Please check:"
              echo "1. BACKEND_HOST secret is set to: 10.0.2.227"
              echo "2. BACKEND_USER secret is set to: ubuntu"
              echo "3. SSH key access is configured"
              exit 1
            fi
            
            # SSH into the backend server through bastion
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 ${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }} << 'ENDSSH'
            
            set -euo pipefail  # Exit on any error, undefined variables, or pipe failures
            
            # Deployment variables
            export DOCKER_IMAGE="${{ env.DOCKER_IMAGE }}"
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
            export CONTAINER_NAME="${{ needs.build-and-push.outputs.container-name }}"
            export ENVIRONMENT="${{ needs.build-and-push.outputs.environment }}"
            export PORT="${{ needs.build-and-push.outputs.port }}"
            
            echo "=== Starting Deployment ==="
            echo "Environment: ${ENVIRONMENT}"
            echo "Image: ${DOCKER_IMAGE}:${IMAGE_TAG}"
            echo "Container: ${CONTAINER_NAME}"
            echo "Port: ${PORT}"
            
            # Function to handle errors
            handle_error() {
              echo "❌ Deployment failed at step: $1"
              echo "📋 Checking for container logs..."
              if docker ps -a -q -f name=${CONTAINER_NAME} | grep -q .; then
                echo "Container logs:"
                docker logs ${CONTAINER_NAME} --tail 50 || true
              fi
              exit 1
            }
            
            # Check if Docker is available
            if ! command -v docker &> /dev/null; then
              handle_error "Docker is not installed or not in PATH"
            fi
            
            # Check Docker permissions
            if ! docker ps &> /dev/null; then
              echo "❌ Docker permission denied. Adding user to docker group..."
              sudo usermod -aG docker $USER || handle_error "Failed to add user to docker group"
              newgrp docker || handle_error "Failed to apply docker group"
              
              # Test again
              if ! docker ps &> /dev/null; then
                echo "❌ Still cannot access Docker. Using sudo..."
                DOCKER_CMD="sudo docker"
              else
                DOCKER_CMD="docker"
              fi
            else
              DOCKER_CMD="docker"
            fi
            
            echo "✅ Docker access confirmed"
            
            # Pull the latest image
            echo "📦 Pulling Docker image..."
            if ! $DOCKER_CMD pull ${DOCKER_IMAGE}:${IMAGE_TAG}; then
              handle_error "Failed to pull Docker image ${DOCKER_IMAGE}:${IMAGE_TAG}"
            fi
            
            # Stop existing container if exists
            if $DOCKER_CMD ps -q -f name=${CONTAINER_NAME} | grep -q .; then
              echo "🛑 Stopping existing container..."
              $DOCKER_CMD stop ${CONTAINER_NAME} || true
              $DOCKER_CMD rm ${CONTAINER_NAME} || true
            fi
            
            # Start new container
            echo "🚀 Starting new container..."
            if ! $DOCKER_CMD run -d \
              --name ${CONTAINER_NAME} \
              --restart unless-stopped \
              -p ${PORT}:3000 \
              -e NODE_ENV=${ENVIRONMENT} \
              -e PORT=3000 \
              -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e REDIS_URL="${{ secrets.REDIS_URL }}" \
              -e LOG_LEVEL="${{ secrets.LOG_LEVEL || 'info' }}" \
              -e AUTH0_DOMAIN="${{ secrets.AUTH0_DOMAIN }}" \
              -e AUTH0_AUDIENCE="${{ secrets.AUTH0_AUDIENCE }}" \
              -e AUTH0_CLIENT_ID="${{ secrets.AUTH0_CLIENT_ID }}" \
              -e AUTH0_CLIENT_SECRET="${{ secrets.AUTH0_CLIENT_SECRET }}" \
              -e AUTH0_WEBHOOK_SECRET="${{ secrets.AUTH0_WEBHOOK_SECRET }}" \
              -e AUTH0_ACTIONS_SECRET="${{ secrets.AUTH0_ACTIONS_SECRET }}" \
              -e RAZORPAY_KEY_ID="${{ secrets.RAZORPAY_KEY_ID }}" \
              -e RAZORPAY_KEY_SECRET="${{ secrets.RAZORPAY_KEY_SECRET }}" \
              -e RAZORPAY_WEBHOOK_SECRET="${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" \
              -e DEFAULT_USER_CREDITS="${{ secrets.DEFAULT_USER_CREDITS || '3' }}" \
              -e SUBSCRIPTION_RECONCILIATION_ENABLED="${{ secrets.SUBSCRIPTION_RECONCILIATION_ENABLED || 'true' }}" \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e IDEOGRAM_API_KEY="${{ secrets.IDEOGRAM_API_KEY }}" \
              -e FAL_KEY="${{ secrets.FAL_KEY }}" \
              -e IMAGEKIT_PUBLIC_KEY="${{ secrets.IMAGEKIT_PUBLIC_KEY }}" \
              -e IMAGEKIT_PRIVATE_KEY="${{ secrets.IMAGEKIT_PRIVATE_KEY }}" \
              -e IMAGEKIT_URL_ENDPOINT="${{ secrets.IMAGEKIT_URL_ENDPOINT }}" \
              -e SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
              -e N8N_WEBHOOK_URL="${{ secrets.N8N_WEBHOOK_URL }}" \
              -e N8N_JWT_SECRET="${{ secrets.N8N_JWT_SECRET }}" \
              -e N8N_REQUEST_KEY="${{ secrets.N8N_REQUEST_KEY }}" \
              -e N8N_GENERATION_FLOW_ID="${{ secrets.N8N_GENERATION_FLOW_ID }}" \
              -e N8N_ENHANCEMENT_FLOW_ID="${{ secrets.N8N_ENHANCEMENT_FLOW_ID }}" \
              ${DOCKER_IMAGE}:${IMAGE_TAG}; then
              handle_error "Failed to start Docker container"
            fi
            
            # Wait for container to start
            echo "⏳ Waiting for container to start..."
            sleep 15
            
            # Verify container is running
            if ! $DOCKER_CMD ps -q -f name=${CONTAINER_NAME} | grep -q .; then
              handle_error "Container failed to start or exited immediately"
            fi
            
            # Health check
            echo "🏥 Performing health check..."
            HEALTH_CHECK_PASSED=false
            for i in {1..30}; do
              if curl -f -s http://localhost:${PORT}/health > /dev/null 2>&1; then
                echo "✅ Health check passed on attempt $i!"
                HEALTH_CHECK_PASSED=true
                break
              fi
              echo "⏳ Health check attempt $i failed, retrying in 5 seconds..."
              sleep 5
            done
            
            if [ "$HEALTH_CHECK_PASSED" = false ]; then
              handle_error "Health check failed after 30 attempts"
            fi
            
            # Clean up old images (keep last 3)
            echo "🧹 Cleaning up old images..."
            OLD_IMAGES=$($DOCKER_CMD images ${DOCKER_IMAGE} --format "table {{.Repository}}:{{.Tag}}\t{{.CreatedAt}}" | tail -n +2 | sort -k2 -r | tail -n +4 | awk '{print $1}')
            if [ -n "$OLD_IMAGES" ]; then
              echo "$OLD_IMAGES" | xargs -r $DOCKER_CMD rmi || true
            fi
            
            echo "🎉 Deployment completed successfully!"
            echo "📊 Container status:"
            $DOCKER_CMD ps -f name=${CONTAINER_NAME}
            
            # Show container logs (last 10 lines)
            echo "📋 Recent container logs:"
            $DOCKER_CMD logs ${CONTAINER_NAME} --tail 10
            
            ENDSSH

  # Rollback deployment
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    
    environment:
      name: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Rollback to Previous Version
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ${{ secrets.BASTION_USER }}
          key: ${{ secrets.BASTION_SSH_KEY }}
          port: ${{ secrets.BASTION_PORT || 22 }}
          script: |
            ssh -o StrictHostKeyChecking=no ${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }} << 'ENDSSH'
            
            set -e
            
            echo "🔄 Starting rollback process..."
            
            # Set container name based on environment
            if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
              CONTAINER_NAME="${{ env.CONTAINER_NAME }}-staging"
              PORT="3002"
            else
              CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
              PORT="3000"
            fi
            
            # Check Docker permissions
            if ! docker ps &> /dev/null; then
              DOCKER_CMD="sudo docker"
            else
              DOCKER_CMD="docker"
            fi
            
            # Get the previous image (second most recent)
            PREVIOUS_IMAGE=$($DOCKER_CMD images ${{ env.DOCKER_IMAGE }} --format "table {{.Repository}}:{{.Tag}}" | tail -n +2 | head -n 2 | tail -n 1 | awk '{print $1}')
            
            if [ -z "$PREVIOUS_IMAGE" ]; then
              echo "❌ No previous image found for rollback"
              exit 1
            fi
            
            echo "📦 Rolling back to: $PREVIOUS_IMAGE"
            
            # Stop current container
            echo "🛑 Stopping current container..."
            $DOCKER_CMD stop ${CONTAINER_NAME} || true
            $DOCKER_CMD rm ${CONTAINER_NAME} || true
            
            # Start previous version (reuse same environment variables)
            echo "🚀 Starting previous version..."
            $DOCKER_CMD run -d \
              --name ${CONTAINER_NAME} \
              --restart unless-stopped \
              -p ${PORT}:3000 \
              -e NODE_ENV=${{ github.event.inputs.environment }} \
              -e PORT=3000 \
              $PREVIOUS_IMAGE
            
            # Health check
            echo "🏥 Performing rollback health check..."
            sleep 10
            for i in {1..20}; do
              if curl -f -s http://localhost:${PORT}/health > /dev/null 2>&1; then
                echo "✅ Rollback completed successfully!"
                exit 0
              fi
              echo "⏳ Health check attempt $i..."
              sleep 3
            done
            
            echo "❌ Rollback health check failed!"
            $DOCKER_CMD logs ${CONTAINER_NAME} --tail 20
            exit 1
            
            ENDSSH