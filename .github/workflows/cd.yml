name: Continuous Deployment - JOMO Backend (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: 'Docker image tag to deploy (e.g., main-abc123)'
        required: false
        type: string
      action:
        description: 'Deployment action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

env:
  DOCKER_IMAGE: ai29/jomo-backend
  CONTAINER_NAME: jomo-backend

jobs:
  manual-deploy:
    name: Manual Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'deploy'
    
    environment:
      name: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Deploy via Bastion Host
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ${{ secrets.BASTION_USER }}
          key: ${{ secrets.BASTION_SSH_KEY }}
          port: ${{ secrets.BASTION_PORT || 22 }}
          timeout: 300s
          script: |
            # Create SSH key for backend server access
            echo "${{ secrets.BACKEND_SSH_KEY || secrets.BASTION_SSH_KEY }}" > /tmp/backend_key
            chmod 600 /tmp/backend_key
            
            # SSH into the backend server through bastion
            ssh -i /tmp/backend_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 ${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }} << 'ENDSSH'
            
            set -e
            
            # Set container name and port based on environment
            if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
              CONTAINER_NAME="${{ env.CONTAINER_NAME }}-staging"
              PORT="3002"
              NODE_ENV="staging"
            else
              CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
              PORT="3000"
              NODE_ENV="production"
            fi
            
            IMAGE_TAG="${{ github.event.inputs.image_tag || 'latest' }}"
            
            echo "=== Manual Deployment to ${{ github.event.inputs.environment }} ==="
            echo "Image: ${{ env.DOCKER_IMAGE }}:${IMAGE_TAG}"
            echo "Container: ${CONTAINER_NAME}"
            echo "Port: ${PORT}"
            
            # Pull image
            docker pull ${{ env.DOCKER_IMAGE }}:${IMAGE_TAG}
            
            # Stop existing container
            docker stop ${CONTAINER_NAME} 2>/dev/null || true
            docker rm ${CONTAINER_NAME} 2>/dev/null || true
            
            # Start new container
            docker run -d \
              --name ${CONTAINER_NAME} \
              --restart unless-stopped \
              -p ${PORT}:3000 \
              -e NODE_ENV=${NODE_ENV} \
              -e PORT=3000 \
              -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e REDIS_URL="${{ secrets.REDIS_URL }}" \
              -e LOG_LEVEL="${{ secrets.LOG_LEVEL || 'info' }}" \
              -e AUTH0_DOMAIN="${{ secrets.AUTH0_DOMAIN }}" \
              -e AUTH0_AUDIENCE="${{ secrets.AUTH0_AUDIENCE }}" \
              -e AUTH0_CLIENT_ID="${{ secrets.AUTH0_CLIENT_ID }}" \
              -e AUTH0_CLIENT_SECRET="${{ secrets.AUTH0_CLIENT_SECRET }}" \
              -e AUTH0_WEBHOOK_SECRET="${{ secrets.AUTH0_WEBHOOK_SECRET }}" \
              -e AUTH0_ACTIONS_SECRET="${{ secrets.AUTH0_ACTIONS_SECRET }}" \
              -e RAZORPAY_KEY_ID="${{ secrets.RAZORPAY_KEY_ID }}" \
              -e RAZORPAY_KEY_SECRET="${{ secrets.RAZORPAY_KEY_SECRET }}" \
              -e RAZORPAY_WEBHOOK_SECRET="${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" \
              -e DEFAULT_USER_CREDITS="${{ secrets.DEFAULT_USER_CREDITS || '3' }}" \
              -e SUBSCRIPTION_RECONCILIATION_ENABLED="${{ secrets.SUBSCRIPTION_RECONCILIATION_ENABLED || 'true' }}" \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e IDEOGRAM_API_KEY="${{ secrets.IDEOGRAM_API_KEY }}" \
              -e FAL_KEY="${{ secrets.FAL_KEY }}" \
              -e IMAGEKIT_PUBLIC_KEY="${{ secrets.IMAGEKIT_PUBLIC_KEY }}" \
              -e IMAGEKIT_PRIVATE_KEY="${{ secrets.IMAGEKIT_PRIVATE_KEY }}" \
              -e IMAGEKIT_URL_ENDPOINT="${{ secrets.IMAGEKIT_URL_ENDPOINT }}" \
              -e SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
              -e N8N_WEBHOOK_URL="${{ secrets.N8N_WEBHOOK_URL }}" \
              -e N8N_JWT_SECRET="${{ secrets.N8N_JWT_SECRET }}" \
              -e N8N_REQUEST_KEY="${{ secrets.N8N_REQUEST_KEY }}" \
              -e N8N_GENERATION_FLOW_ID="${{ secrets.N8N_GENERATION_FLOW_ID }}" \
              -e N8N_ENHANCEMENT_FLOW_ID="${{ secrets.N8N_ENHANCEMENT_FLOW_ID }}" \
              ${{ env.DOCKER_IMAGE }}:${IMAGE_TAG}
            
            # Health check
            sleep 10
            for i in {1..20}; do
              if curl -f -s http://localhost:${PORT}/health > /dev/null 2>&1; then
                echo "✅ Deployment successful!"
                exit 0
              fi
              echo "⏳ Health check attempt $i..."
              sleep 3
            done
            
            echo "❌ Health check failed!"
            exit 1
            
            ENDSSH
            
            rm -f /tmp/backend_key

  rollback:
    name: Rollback ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'rollback'
    
    environment:
      name: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Rollback via Bastion Host
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ${{ secrets.BASTION_USER }}
          key: ${{ secrets.BASTION_SSH_KEY }}
          port: ${{ secrets.BASTION_PORT || 22 }}
          script: |
            echo "${{ secrets.BACKEND_SSH_KEY || secrets.BASTION_SSH_KEY }}" > /tmp/backend_key
            chmod 600 /tmp/backend_key
            
            ssh -i /tmp/backend_key -o StrictHostKeyChecking=no ${{ secrets.BACKEND_USER }}@${{ secrets.BACKEND_HOST }} << 'ENDSSH'
            
            set -e
            
            if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
              CONTAINER_NAME="${{ env.CONTAINER_NAME }}-staging"
              PORT="3002"
            else
              CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
              PORT="3000"
            fi
            
            echo "🔄 Rolling back ${CONTAINER_NAME}..."
            
            # Get previous image
            PREVIOUS_IMAGE=$(docker images ${{ env.DOCKER_IMAGE }} --format "table {{.Repository}}:{{.Tag}}" | tail -n +2 | head -n 2 | tail -n 1 | awk '{print $1}')
            
            if [ -z "$PREVIOUS_IMAGE" ]; then
              echo "❌ No previous image found"
              exit 1
            fi
            
            echo "📦 Rolling back to: $PREVIOUS_IMAGE"
            
            # Stop current container
            docker stop ${CONTAINER_NAME} || true
            docker rm ${CONTAINER_NAME} || true
            
            # Start previous version (simplified)
            docker run -d \
              --name ${CONTAINER_NAME} \
              --restart unless-stopped \
              -p ${PORT}:3000 \
              -e NODE_ENV=${{ github.event.inputs.environment == 'staging' && 'staging' || 'production' }} \
              -e PORT=3000 \
              --env-file <(echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}") \
              $PREVIOUS_IMAGE
            
            # Health check
            sleep 10
            if curl -f -s http://localhost:${PORT}/health > /dev/null 2>&1; then
              echo "✅ Rollback successful!"
            else
              echo "❌ Rollback failed!"
              exit 1
            fi
            
            ENDSSH
            
            rm -f /tmp/backend_key